<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Scoreboard" />
<meta name="theme-color" content="#0d0b1f" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" type="image/png" href="icon-192.png" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<title>⚡ Showdown Scoreboard ⚡</title>
<style>
  :root {
    --left-1: #ff512f;
    --left-2: #dd2476;
    --right-1: #1fa2ff;
    --right-2: #12d8fa;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
  }

  html, body { height: 100%; }

  body {
    font-family: 'Trebuchet MS', 'Segoe UI', system-ui, sans-serif;
    background: #0d0b1f;
    background-image:
      radial-gradient(circle at 20% 20%, rgba(221,36,118,0.25), transparent 45%),
      radial-gradient(circle at 80% 30%, rgba(31,162,255,0.25), transparent 45%),
      radial-gradient(circle at 50% 90%, rgba(255,200,0,0.15), transparent 50%);
    color: #fff;
    min-height: 100vh;
    min-height: 100dvh;
    overflow-x: hidden;
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation; /* kill double-tap-to-zoom delay */
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }

  /* ---------- Header ---------- */
  header {
    text-align: center;
    padding: 18px 10px 8px;
  }

  h1 {
    font-size: clamp(1.8rem, 5vw, 3.2rem);
    font-weight: 900;
    letter-spacing: 2px;
    text-transform: uppercase;
    background: linear-gradient(90deg, #ff512f, #ffd200, #12d8fa, #dd2476, #ff512f);
    background-size: 300% auto;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: shimmer 6s linear infinite;
    text-shadow: 0 0 30px rgba(255,255,255,0.15);
  }

  @keyframes shimmer {
    to { background-position: 300% center; }
  }

  .subtitle {
    margin-top: 4px;
    font-size: 0.95rem;
    color: #b8b3d6;
    letter-spacing: 1px;
  }

  /* ---------- Match timer ---------- */
  .timer-bar {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    margin-top: 12px;
  }

  .timer-display {
    font-variant-numeric: tabular-nums;
    font-size: clamp(1.6rem, 5vw, 2.4rem);
    font-weight: 900;
    letter-spacing: 2px;
    color: #fff;
    background: rgba(0,0,0,0.3);
    border: 1px solid rgba(255,255,255,0.18);
    padding: 4px 16px;
    border-radius: 12px;
    text-shadow: 0 0 18px rgba(18,216,250,0.5);
    min-width: 116px;
    text-align: center;
  }
  .timer-display.running { box-shadow: 0 0 22px rgba(18,216,250,0.45); }

  .timer-btn {
    border: 1px solid rgba(255,255,255,0.25);
    background: rgba(255,255,255,0.1);
    color: #fff;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    font-size: 1.2rem;
    font-weight: 800;
    cursor: pointer;
    transition: transform 0.1s, background 0.2s;
  }
  .timer-btn:active { transform: scale(0.9); }

  /* ---------- Board ---------- */
  .board {
    display: flex;
    gap: 20px;
    padding: 20px;
    max-width: 1200px;
    margin: 0 auto;
    align-items: stretch;
  }

  .vs {
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: clamp(2rem, 6vw, 4rem);
    font-weight: 900;
    font-style: italic;
    color: #ffd200;
    text-shadow: 0 0 20px rgba(255,210,0,0.6);
    flex: 0 0 auto;
    animation: pulse 2s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.12); }
  }

  .team {
    flex: 1;
    border-radius: 24px;
    padding: 22px 18px 26px;
    position: relative;
    cursor: pointer;
    transition: transform 0.12s ease, box-shadow 0.3s ease;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 60vh;
    overflow: hidden;
  }

  .team::before {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(120deg, var(--c1), var(--c2));
    opacity: 0.95;
    z-index: 0;
  }

  .team.left  { --c1: var(--left-1);  --c2: var(--left-2);  box-shadow: 0 0 50px rgba(221,36,118,0.45); }
  .team.right { --c1: var(--right-1); --c2: var(--right-2); box-shadow: 0 0 50px rgba(31,162,255,0.45); }

  .team:active { transform: scale(0.985); }

  .team > * { position: relative; z-index: 1; }

  /* flash feedback when a side is tapped (touch has no hover) */
  .team.flash::after {
    content: "";
    position: absolute;
    inset: 0;
    background: rgba(255,255,255,0.35);
    z-index: 1;
    animation: flash 0.25s ease-out;
    pointer-events: none;
  }
  @keyframes flash { from { opacity: 1; } to { opacity: 0; } }

  /* only enable hover effects on devices that actually have a pointer */
  @media (hover: hover) {
    .team:hover .tap-hint { opacity: 1; }
    .btn:hover { background: #fff; }
    .reset-btn:hover { filter: brightness(1.08); }
  }

  .name-input {
    width: 100%;
    background: rgba(0,0,0,0.22);
    border: 2px dashed rgba(255,255,255,0.35);
    border-radius: 14px;
    color: #fff;
    font-size: clamp(1.3rem, 3.5vw, 2.1rem);
    font-weight: 800;
    text-align: center;
    padding: 10px 8px;
    letter-spacing: 1px;
    text-transform: uppercase;
    outline: none;
    transition: border-color 0.2s, background 0.2s;
  }
  .name-input::placeholder { color: rgba(255,255,255,0.6); font-weight:600; }
  .name-input:focus {
    border-color: #fff;
    border-style: solid;
    background: rgba(0,0,0,0.35);
  }

  .score {
    font-size: clamp(5rem, 22vw, 14rem);
    font-weight: 900;
    line-height: 1;
    margin: auto 0;
    text-shadow: 0 6px 0 rgba(0,0,0,0.25), 0 0 40px rgba(255,255,255,0.35);
    transition: transform 0.15s ease;
  }

  .score.bump { animation: bump 0.3s ease; }
  @keyframes bump {
    0% { transform: scale(1); }
    40% { transform: scale(1.35); }
    100% { transform: scale(1); }
  }

  .tap-hint {
    font-size: 0.95rem;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    opacity: 0.85;
    background: rgba(0,0,0,0.25);
    padding: 8px 16px;
    border-radius: 999px;
  }

  /* control row inside a team */
  .controls {
    display: flex;
    gap: 10px;
    margin-top: 14px;
    flex-wrap: wrap;
    justify-content: center;
  }

  .btn {
    border: none;
    border-radius: 12px;
    padding: 10px 16px;
    font-size: 1rem;
    font-weight: 800;
    cursor: pointer;
    background: rgba(255,255,255,0.92);
    color: #1a1a2e;
    transition: transform 0.1s, background 0.2s;
    box-shadow: 0 4px 0 rgba(0,0,0,0.25);
  }
  .btn:active { transform: translateY(3px); box-shadow: 0 1px 0 rgba(0,0,0,0.25); }
  .btn.minus { background: rgba(0,0,0,0.35); color: #fff; }

  .leader-badge {
    position: absolute;
    top: 14px;
    right: 14px;
    font-size: 1.8rem;
    opacity: 0;
    transform: scale(0.5) rotate(-20deg);
    transition: opacity 0.3s, transform 0.3s;
    z-index: 2;
    filter: drop-shadow(0 0 8px rgba(255,210,0,0.8));
  }
  .team.leading .leader-badge { opacity: 1; transform: scale(1) rotate(0); }

  /* ---------- Footer controls ---------- */
  .footer-controls {
    display: flex;
    justify-content: center;
    gap: 14px;
    flex-wrap: wrap;
    padding: 6px 20px 40px;
  }

  .control-pill {
    display: flex;
    align-items: center;
    gap: 10px;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.18);
    padding: 10px 18px;
    border-radius: 999px;
  }

  .control-pill label { font-size: 0.85rem; color: #cfc9ec; letter-spacing: 1px; }

  .step-select {
    background: #1a1633;
    color: #fff;
    border: 1px solid rgba(255,255,255,0.25);
    border-radius: 8px;
    padding: 6px 10px;
    font-weight: 700;
    cursor: pointer;
  }

  .reset-btn {
    background: linear-gradient(120deg, #ff512f, #dd2476);
    color: #fff;
    border: none;
    padding: 12px 26px;
    border-radius: 999px;
    font-weight: 800;
    letter-spacing: 1px;
    cursor: pointer;
    box-shadow: 0 5px 20px rgba(221,36,118,0.5);
    transition: transform 0.1s;
  }
  .reset-btn:active { transform: scale(0.95); }

  /* ---------- Winner banner ---------- */
  .winner-overlay {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: rgba(5,4,15,0.78);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
  }
  .winner-overlay.show { display: flex; animation: fadeIn 0.3s ease; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  .winner-card {
    text-align: center;
    background: linear-gradient(135deg, var(--w1, #ff512f), var(--w2, #dd2476));
    border-radius: 28px;
    padding: 34px 30px 30px;
    max-width: 440px;
    width: 100%;
    box-shadow: 0 20px 70px rgba(0,0,0,0.6), 0 0 60px rgba(255,255,255,0.15);
    animation: popIn 0.45s cubic-bezier(.2,1.3,.4,1);
  }
  @keyframes popIn {
    0% { transform: scale(0.6); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }

  .winner-trophy {
    font-size: 4rem;
    filter: drop-shadow(0 0 18px rgba(255,210,0,0.8));
    animation: pulse 1.4s ease-in-out infinite;
  }
  .winner-label {
    margin-top: 6px;
    font-size: 1rem;
    font-weight: 700;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: rgba(255,255,255,0.85);
  }
  .winner-name {
    font-size: clamp(2rem, 8vw, 3.2rem);
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin: 4px 0 2px;
    text-shadow: 0 4px 0 rgba(0,0,0,0.25);
    word-break: break-word;
  }
  .winner-score {
    font-size: 1.3rem;
    font-weight: 800;
    color: rgba(255,255,255,0.9);
    margin-bottom: 22px;
  }
  .winner-actions {
    display: flex;
    gap: 12px;
    justify-content: center;
    flex-wrap: wrap;
  }
  .winner-actions .btn { font-size: 1.05rem; padding: 13px 22px; }

  /* ---------- Phones (portrait) ---------- */
  @media (max-width: 640px) {
    header { padding: 12px 10px 4px; }
    .subtitle { font-size: 0.8rem; }
    .board {
      flex-direction: column;
      gap: 12px;
      padding: 12px;
    }
    .vs {
      padding: 2px 0;
      font-size: 1.8rem;
    }
    .team {
      min-height: 0;
      flex: 1 1 0;
      padding: 16px 14px 18px;
      border-radius: 20px;
    }
    .score { font-size: clamp(4rem, 26vw, 9rem); margin: 8px 0; }
    .btn { padding: 14px 20px; font-size: 1.05rem; } /* bigger tap targets */
    .footer-controls { padding: 4px 12px 20px; gap: 10px; }
    .tap-hint { font-size: 0.8rem; padding: 6px 12px; }
  }

  /* ---------- Phones (landscape) — keep columns side by side ---------- */
  @media (max-height: 500px) and (orientation: landscape) {
    header { padding: 6px; }
    h1 { font-size: 1.4rem; }
    .subtitle { display: none; }
    .timer-bar { margin-top: 4px; gap: 8px; }
    .timer-display { font-size: 1.3rem; padding: 2px 12px; min-width: 92px; }
    .timer-btn { width: 36px; height: 36px; font-size: 1rem; }
    .board { padding: 8px; gap: 10px; }
    .team { min-height: 0; padding: 10px; }
    .score { font-size: clamp(3rem, 14vh, 7rem); }
    .footer-controls { padding: 4px 8px 8px; }
  }
</style>
</head>
<body>
  <header>
    <h1>⚡ Showdown Scoreboard ⚡</h1>
    <p class="subtitle">Tap a side to score • Click a name to rename</p>
    <div class="timer-bar">
      <button class="timer-btn" id="timer-toggle" aria-label="Start or pause timer">▶</button>
      <span class="timer-display" id="timer-display">00:00</span>
      <button class="timer-btn" id="timer-reset" aria-label="Reset timer">↺</button>
    </div>
  </header>

  <main class="board">
    <section class="team left leading" id="team-left" data-side="left">
      <span class="leader-badge">👑</span>
      <input class="name-input" id="name-left" value="" placeholder="Team One" maxlength="18" />
      <div class="score" id="score-left">0</div>
      <div class="tap-hint">Tap anywhere to +<span class="step-label-left">1</span></div>
      <div class="controls">
        <button class="btn minus" data-action="minus" data-side="left">– Point</button>
        <button class="btn" data-action="plus" data-side="left">+ Point</button>
      </div>
    </section>

    <div class="vs">VS</div>

    <section class="team right" id="team-right" data-side="right">
      <span class="leader-badge">👑</span>
      <input class="name-input" id="name-right" value="" placeholder="Team Two" maxlength="18" />
      <div class="score" id="score-right">0</div>
      <div class="tap-hint">Tap anywhere to +<span class="step-label-right">1</span></div>
      <div class="controls">
        <button class="btn minus" data-action="minus" data-side="right">– Point</button>
        <button class="btn" data-action="plus" data-side="right">+ Point</button>
      </div>
    </section>
  </main>

  <div class="footer-controls">
    <div class="control-pill">
      <label for="step">POINTS PER TAP</label>
      <select id="step" class="step-select">
        <option value="1">1</option>
        <option value="2">2</option>
        <option value="3">3</option>
        <option value="5">5</option>
        <option value="10">10</option>
      </select>
    </div>
    <div class="control-pill">
      <label for="target">PLAY TO</label>
      <select id="target" class="step-select">
        <option value="0">Off</option>
        <option value="7">7</option>
        <option value="11">11</option>
        <option value="15">15</option>
        <option value="21">21</option>
        <option value="25">25</option>
      </select>
    </div>
    <button class="reset-btn" id="reset">🔄 Reset Scores</button>
  </div>

  <div class="winner-overlay" id="winner-overlay">
    <div class="winner-card" id="winner-card">
      <div class="winner-trophy">🏆</div>
      <div class="winner-label">Winner</div>
      <div class="winner-name" id="winner-name">Team</div>
      <div class="winner-score" id="winner-score">0 – 0</div>
      <div class="winner-actions">
        <button class="btn minus" id="winner-keep">Keep playing</button>
        <button class="btn" id="winner-rematch">Rematch</button>
      </div>
    </div>
  </div>

<script>
  const scores = { left: 0, right: 0 };
  let step = 1;
  let target = 0;             // 0 = no win target
  let lastWinner = null;      // side that triggered the current banner
  const timer = { elapsed: 0, running: false, startedAt: 0 }; // elapsed in ms

  const els = {
    left:  { score: document.getElementById('score-left'),  team: document.getElementById('team-left'),  name: document.getElementById('name-left') },
    right: { score: document.getElementById('score-right'), team: document.getElementById('team-right'), name: document.getElementById('name-right') },
  };

  // ---- persistence ----
  function save() {
    localStorage.setItem('scoreboard', JSON.stringify({
      scores,
      names: { left: els.left.name.value, right: els.right.name.value },
      step,
      target,
      timer,
    }));
  }

  function load() {
    try {
      const data = JSON.parse(localStorage.getItem('scoreboard'));
      if (!data) return;
      scores.left = data.scores?.left ?? 0;
      scores.right = data.scores?.right ?? 0;
      if (data.names?.left) els.left.name.value = data.names.left;
      if (data.names?.right) els.right.name.value = data.names.right;
      if (data.step) {
        step = data.step;
        document.getElementById('step').value = String(step);
      }
      if (data.target != null) {
        target = data.target;
        document.getElementById('target').value = String(target);
      }
      if (data.timer) {
        timer.elapsed = data.timer.elapsed ?? 0;
        timer.running = !!data.timer.running;
        // resume the running clock from where it left off
        if (timer.running) timer.startedAt = Date.now();
      }
    } catch (e) { /* ignore corrupt storage */ }
  }

  // ---- rendering ----
  function render(bumpSide) {
    for (const side of ['left', 'right']) {
      els[side].score.textContent = scores[side];
    }
    // leader crown
    els.left.team.classList.toggle('leading', scores.left > scores.right);
    els.right.team.classList.toggle('leading', scores.right > scores.left);

    if (bumpSide) {
      const s = els[bumpSide].score;
      s.classList.remove('bump');
      void s.offsetWidth; // restart animation
      s.classList.add('bump');
    }
    document.querySelector('.step-label-left').textContent = step;
    document.querySelector('.step-label-right').textContent = step;
    save();
  }

  function change(side, delta) {
    scores[side] = Math.max(0, scores[side] + delta);
    render(delta > 0 ? side : null);
    if (delta > 0) {
      confetti(side);
      flash(side);
      if (navigator.vibrate) navigator.vibrate(20); // subtle haptic on mobile
      // win target reached → celebrate
      if (target > 0 && scores[side] >= target && lastWinner !== side) {
        showWinner(side);
      }
    }
  }

  // brief white flash on the tapped panel (touch has no :hover feedback)
  function flash(side) {
    const t = els[side].team;
    t.classList.remove('flash');
    void t.offsetWidth;
    t.classList.add('flash');
  }

  // ---- confetti burst ----
  function confetti(side) {
    const team = els[side].team;
    const rect = team.getBoundingClientRect();
    const colors = side === 'left'
      ? ['#ff512f', '#dd2476', '#ffd200', '#fff']
      : ['#1fa2ff', '#12d8fa', '#ffd200', '#fff'];
    for (let i = 0; i < 18; i++) {
      const p = document.createElement('div');
      p.style.cssText = `
        position:fixed; width:10px; height:10px; z-index:50; pointer-events:none;
        border-radius:2px;
        left:${rect.left + rect.width / 2}px;
        top:${rect.top + rect.height / 3}px;
        background:${colors[i % colors.length]};
      `;
      document.body.appendChild(p);
      const angle = Math.random() * Math.PI * 2;
      const dist = 80 + Math.random() * 160;
      const dx = Math.cos(angle) * dist;
      const dy = Math.sin(angle) * dist - 60;
      p.animate([
        { transform: 'translate(0,0) rotate(0)', opacity: 1 },
        { transform: `translate(${dx}px, ${dy + 200}px) rotate(${Math.random()*720}deg)`, opacity: 0 }
      ], { duration: 900 + Math.random() * 400, easing: 'cubic-bezier(.2,.7,.3,1)' })
       .onfinish = () => p.remove();
    }
  }

  // ---- match timer ----
  const timerDisplay = document.getElementById('timer-display');
  const timerToggle = document.getElementById('timer-toggle');

  function timerTotal() {
    return timer.elapsed + (timer.running ? Date.now() - timer.startedAt : 0);
  }

  function renderTimer() {
    const total = Math.floor(timerTotal() / 1000);
    const m = String(Math.floor(total / 60)).padStart(2, '0');
    const s = String(total % 60).padStart(2, '0');
    timerDisplay.textContent = `${m}:${s}`;
    timerDisplay.classList.toggle('running', timer.running);
    timerToggle.textContent = timer.running ? '⏸' : '▶';
  }

  function toggleTimer() {
    if (timer.running) {
      timer.elapsed += Date.now() - timer.startedAt;
      timer.running = false;
    } else {
      timer.startedAt = Date.now();
      timer.running = true;
    }
    renderTimer();
    save();
  }

  function resetTimer() {
    timer.elapsed = 0;
    timer.running = false;
    timer.startedAt = 0;
    renderTimer();
    save();
  }

  timerToggle.addEventListener('click', toggleTimer);
  document.getElementById('timer-reset').addEventListener('click', resetTimer);
  setInterval(() => { if (timer.running) renderTimer(); }, 250); // live tick

  // ---- winner banner ----
  const overlay = document.getElementById('winner-overlay');

  function showWinner(side) {
    lastWinner = side;
    // pause the clock — the game's over
    if (timer.running) {
      timer.elapsed += Date.now() - timer.startedAt;
      timer.running = false;
      renderTimer();
    }
    const palette = side === 'left'
      ? ['#ff512f', '#dd2476'] : ['#1fa2ff', '#12d8fa'];
    const card = document.getElementById('winner-card');
    card.style.setProperty('--w1', palette[0]);
    card.style.setProperty('--w2', palette[1]);
    const name = els[side].name.value.trim() || els[side].name.placeholder;
    document.getElementById('winner-name').textContent = name;
    document.getElementById('winner-score').textContent = `${scores.left} – ${scores.right}`;
    overlay.classList.add('show');
    if (navigator.vibrate) navigator.vibrate([40, 60, 120]);
    // a bigger burst from both sides to celebrate
    confetti('left');
    confetti('right');
    save();
  }

  function hideWinner() {
    overlay.classList.remove('show');
  }

  document.getElementById('winner-keep').addEventListener('click', () => {
    // dismiss but keep score; arm again only when the leader scores past target
    hideWinner();
  });
  document.getElementById('winner-rematch').addEventListener('click', () => {
    scores.left = 0;
    scores.right = 0;
    lastWinner = null;
    hideWinner();
    resetTimer();
    render();
  });

  // ---- events ----
  for (const side of ['left', 'right']) {
    // tap the panel to add points (but not when interacting with inputs/buttons)
    els[side].team.addEventListener('click', (e) => {
      if (e.target.closest('button') || e.target.closest('input')) return;
      change(side, step);
    });
    els[side].name.addEventListener('input', save);
    // prevent a name click from also scoring is handled by guard above
  }

  document.querySelectorAll('.btn').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const side = btn.dataset.side;
      const delta = btn.dataset.action === 'plus' ? step : -step;
      change(side, delta);
    });
  });

  document.getElementById('step').addEventListener('change', (e) => {
    step = parseInt(e.target.value, 10) || 1;
    render();
  });

  document.getElementById('target').addEventListener('change', (e) => {
    target = parseInt(e.target.value, 10) || 0;
    lastWinner = null; // re-arm for the new target
    save();
  });

  document.getElementById('reset').addEventListener('click', () => {
    scores.left = 0;
    scores.right = 0;
    lastWinner = null;
    render();
  });

  // keyboard: A = left+, S = right+
  document.addEventListener('keydown', (e) => {
    if (document.activeElement.tagName === 'INPUT') return;
    if (e.key.toLowerCase() === 'a') change('left', step);
    if (e.key.toLowerCase() === 's') change('right', step);
  });

  // ---- offline / installable PWA ----
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(() => { /* offline-only is fine */ });
    });
  }

  load();
  render();
  renderTimer();
</script>
</body>
</html>
