name: Weekly NSW Auction Results Scrape

on:
  # Run every Sunday at 6am Sydney time (Saturday 7pm UTC during AEDT)
  schedule:
    - cron: '0 19 * * 6'  # UTC time - adjust for your timezone

  # Allow manual trigger
  workflow_dispatch:
    inputs:
      limit:
        description: 'Limit number of suburbs (for testing)'
        required: false
        default: ''

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create data directories
        run: |
          mkdir -p data/raw data/processed data/archive logs

      - name: Run scraper
        run: |
          if [ -n "${{ github.event.inputs.limit }}" ]; then
            python src/runner.py scrape --limit ${{ github.event.inputs.limit }}
          else
            python src/runner.py scrape
          fi

      - name: Upload results as artifact
        uses: actions/upload-artifact@v4
        with:
          name: auction-results-${{ github.run_number }}
          path: |
            data/processed/*.csv
            data/processed/*.txt
          retention-days: 90

      - name: Commit and push data
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

          # Add new data files
          git add data/

          # Check if there are changes to commit
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            WEEK_ENDING=$(date -d "last saturday" +%Y-%m-%d)
            git commit -m "Weekly auction data update: $WEEK_ENDING"
            git push
          fi

      - name: Generate report summary
        run: |
          echo "## Weekly Auction Results Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f data/processed/weekly_report_*.txt ]; then
            head -50 data/processed/weekly_report_*.txt | tail -40 >> $GITHUB_STEP_SUMMARY
          else
            echo "Report generation in progress or no data available." >> $GITHUB_STEP_SUMMARY
          fi
