<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#002555" />
  <meta name="robots" content="noindex, nofollow" />
  <title>LMS Advisory — Submission (Staff View)</title>
  <style>
:root {
  /* LMS Advisory official brand palette
     Dark Navy  PMS 7463  (CMYK 100/62/12/62)
     Orange     PMS 144c  (CMYK 0/50/100/0)
     Grey       PMS 432   (CMYK 0/0/0/80) */
  --navy: #002555;          /* primary brand — buttons, selected states, headings */
  --navy-deep: #001a3d;     /* hover / pressed */
  --navy-soft: #e4ebf3;     /* selected backgrounds, soft fills */
  --orange: #ed8b00;        /* accent — progress, required marks, highlights */
  --orange-deep: #c77600;
  --orange-soft: #fdf1db;
  --grey: #333f48;          /* PMS 432 — strong secondary */

  --bg: #f5f6f9;
  --surface: #ffffff;
  --ink: #1f2a38;           /* body text */
  --muted: #5b6573;
  --line: #dde1ea;
  --accent: var(--navy);    /* engine uses --accent for primary actions */
  --accent-ink: var(--navy-deep);
  --accent-soft: var(--navy-soft);
  --done: #16a34a;
  --warn: var(--orange);
  --error: #dc2626;
  --error-soft: #fef2f2;
  --shadow: 0 1px 2px rgba(15, 23, 42, 0.04), 0 10px 30px rgba(21, 41, 78, 0.08);
  --radius: 16px;
  --radius-sm: 10px;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  /* LMS primary typeface: Georgia (web-safe serif, no external dependency) */
  font: 16px/1.6 Georgia, "Times New Roman", "Liberation Serif", serif;
  color: var(--ink);
  background: var(--bg);
  min-height: 100dvh;
  -webkit-font-smoothing: antialiased;
}

.app { max-width: 680px; margin: 0 auto; padding: 24px 16px 64px; }

/* Header & progress */
header.top { padding: 4px 4px 18px; }
.brand { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }

/* LMS logo mark: navy tile with an orange vertical bar, echoing the logo */
.logo-mark {
  display: inline-flex; align-items: center;
  background: var(--navy); color: #fff;
  border-radius: 8px; padding: 9px 14px 9px 11px; gap: 10px;
  box-shadow: 0 2px 8px rgba(21, 41, 78, 0.25);
}
.logo-mark::before {
  content: ""; width: 4px; align-self: stretch; min-height: 22px;
  background: var(--orange); border-radius: 2px;
}
.logo-mark .lm-l { font-weight: 800; letter-spacing: 0.12em; font-size: 19px; line-height: 1; }
.logo-mark .lm-s { font-size: 9.5px; letter-spacing: 0.34em; opacity: 0.85; margin-top: 3px; }
.logo-mark .lm-stack { display: flex; flex-direction: column; }

.brand .titles h1 { margin: 0; font-size: 17px; font-weight: 700; color: var(--navy); letter-spacing: -0.01em; }
.brand .titles .tag { color: var(--muted); font-size: 13px; }

.progress { margin-top: 18px; }
.progress-track {
  height: 8px; background: var(--line); border-radius: 999px; overflow: hidden;
}
.progress-fill {
  height: 100%; width: 0%;
  background: linear-gradient(90deg, var(--orange), var(--orange-deep));
  border-radius: 999px; transition: width 0.35s ease;
}
.progress-label { margin-top: 8px; font-size: 13px; color: var(--muted); font-weight: 500; }

/* Card */
.card {
  background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--radius); box-shadow: var(--shadow);
  padding: 24px; margin-top: 16px;
}
/* Honeypot — pushed off-screen, never shown to real users */
.hp-field { position: absolute; left: -9999px; top: auto; width: 1px; height: 1px; overflow: hidden; }

/* Consent row on the review step */
.consent-row { margin: 18px 0 4px; }
.consent-row .opt { align-items: flex-start; }
.consent-row a { color: var(--navy); font-weight: 700; }
.consent-row.invalid .opt { border-color: var(--error); }

.intro-note {
  margin: 0 0 18px; padding: 14px 16px; font-size: 14.5px; line-height: 1.55;
  color: var(--navy); background: var(--navy-soft); border-radius: var(--radius-sm);
  border-left: 4px solid var(--orange);
}
.step-head h2 { margin: 0 0 4px; font-size: 21px; letter-spacing: -0.01em; color: var(--navy); }
.step-head p { margin: 0 0 8px; color: var(--muted); font-size: 14px; }

/* Questions */
.q { padding: 18px 0; border-top: 1px solid var(--line); }
.q:first-of-type { border-top: 0; padding-top: 8px; }
.q-label { display: block; font-weight: 600; margin-bottom: 4px; }
.q-label .req { color: var(--orange); margin-left: 2px; font-weight: 700; }
.q-help { color: var(--muted); font-size: 13.5px; margin: 0 0 12px; }

input[type="text"], input[type="tel"], input[type="email"],
input[type="date"], select, textarea {
  width: 100%; font: inherit; color: var(--ink);
  background: var(--surface);
  border: 1.5px solid var(--line); border-radius: var(--radius-sm);
  padding: 11px 13px; outline: none; transition: border-color 0.15s, box-shadow 0.15s;
}
input:focus, select:focus, textarea:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-soft);
}
textarea { resize: vertical; min-height: 92px; }
.invalid input, .invalid select, .invalid textarea,
.invalid .yesno, .invalid .bank, .invalid .opt-list {
  border-color: var(--error);
}
.field-error { color: var(--error); font-size: 13px; margin-top: 6px; display: none; }
.invalid .field-error { display: block; }

/* Yes/No segmented control */
.yesno { display: inline-flex; border: 1.5px solid var(--line); border-radius: 999px; overflow: hidden; }
.yesno button {
  appearance: none; border: 0; background: var(--surface); cursor: pointer;
  font: inherit; font-weight: 600; padding: 9px 26px; color: var(--muted);
  transition: background 0.15s, color 0.15s;
}
.yesno button + button { border-left: 1.5px solid var(--line); }
.yesno button[aria-pressed="true"] { background: var(--accent); color: #fff; }

/* Checkbox / acknowledge list */
.opt-list { display: flex; flex-direction: column; gap: 8px; }
.opt {
  display: flex; gap: 11px; align-items: flex-start;
  border: 1.5px solid var(--line); border-radius: var(--radius-sm);
  padding: 12px 14px; cursor: pointer; transition: border-color 0.15s, background 0.15s;
}
.opt:hover { border-color: var(--accent); }
.opt.checked { border-color: var(--accent); background: var(--accent-soft); }
.opt input { margin: 3px 0 0; width: 18px; height: 18px; accent-color: var(--accent); flex: none; }
.opt span { font-size: 14.5px; }
.ack span { font-size: 14px; color: var(--ink); }

/* Bank group */
.bank { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.bank .full { grid-column: 1 / -1; }
.bank label { font-size: 12.5px; color: var(--muted); display: block; margin-bottom: 4px; font-weight: 600; }

/* File input */
.file-drop {
  border: 1.5px dashed var(--line); border-radius: var(--radius-sm);
  padding: 20px; text-align: center; color: var(--muted); cursor: pointer;
  transition: border-color 0.15s, background 0.15s;
}
.file-drop:hover { border-color: var(--accent); background: var(--accent-soft); }
.file-drop input { display: none; }
.file-list { margin-top: 10px; display: flex; flex-direction: column; gap: 6px; }
.file-chip {
  display: flex; justify-content: space-between; align-items: center; gap: 10px;
  background: var(--bg); border: 1px solid var(--line);
  border-radius: var(--radius-sm); padding: 8px 12px; font-size: 13.5px;
}
.file-chip button { appearance: none; border: 0; background: none; color: var(--error); cursor: pointer; font-weight: 600; }

/* Navigation */
.nav { display: flex; justify-content: space-between; gap: 12px; margin-top: 20px; }
.btn {
  appearance: none; border: 0; cursor: pointer; font: inherit; font-weight: 600;
  border-radius: var(--radius-sm); padding: 13px 24px; transition: background 0.15s, opacity 0.15s;
}
.btn-primary { background: var(--accent); color: #fff; }
.btn-primary:hover { background: var(--accent-ink); }
.btn-ghost { background: var(--surface); color: var(--ink); border: 1.5px solid var(--line); }
.btn-ghost:hover { border-color: var(--accent); color: var(--accent); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.nav .spacer { flex: 1; }

/* Review */
.review-item { padding: 12px 0; border-top: 1px solid var(--line); }
.review-item:first-child { border-top: 0; }
.review-q { font-size: 13px; color: var(--muted); }
.review-a { font-weight: 600; margin-top: 2px; white-space: pre-wrap; }
.review-edit { float: right; font-size: 13px; color: var(--accent); background: none; border: 0; cursor: pointer; font-weight: 600; }

/* Status / banners */
.banner { border-radius: var(--radius-sm); padding: 12px 14px; font-size: 14px; margin-top: 16px; }
.banner-error { background: var(--error-soft); color: var(--error); border: 1px solid #fecaca; }
.banner-info { background: var(--accent-soft); color: var(--accent-ink); }

/* Success screen */
.success { text-align: center; padding: 16px 8px; }
.success .check {
  width: 64px; height: 64px; margin: 0 auto 16px; border-radius: 999px;
  background: var(--accent-soft); color: var(--accent);
  display: grid; place-items: center; font-size: 32px;
}
.success h2 { margin: 0 0 8px; }
.success p { color: var(--muted); margin: 0 auto; max-width: 42ch; }
.ref { display: inline-block; margin-top: 14px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  background: var(--bg); border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 6px 12px; }

.footnote { text-align: center; color: var(--muted); font-size: 12.5px; margin-top: 20px; }
.footnote.firm { margin-top: 6px; font-size: 11px; opacity: 0.85; }

/* ---------------------------------------------------- Staff results view */
.results-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.results-head .meta { color: var(--muted); font-size: 13px; }
.section-title { font-size: 13px; text-transform: uppercase; letter-spacing: 0.04em;
  color: var(--muted); font-weight: 700; margin: 22px 0 6px; }

/* Xero quick-copy card */
.xero-card { background: var(--navy-soft); border: 1px solid #c3d0e2; border-radius: var(--radius);
  padding: 16px; margin-top: 8px; }
.xero-card h3 { margin: 0 0 4px; font-size: 16px; color: var(--navy); }
.xero-card .hint { margin: 0 0 12px; font-size: 13px; color: var(--navy); opacity: 0.85; }
.copy-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 8px; }

/* A click-to-copy field */
.cp {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  width: 100%; text-align: left; cursor: pointer; font: inherit;
  background: var(--surface); border: 1.5px solid var(--line); border-radius: var(--radius-sm);
  padding: 9px 12px; transition: border-color 0.15s, background 0.15s;
}
.cp:hover { border-color: var(--accent); }
.cp.copied { border-color: var(--done); background: #f0fdf4; }
.cp .cp-body { min-width: 0; }
.cp .cp-label { font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.03em; color: var(--muted); font-weight: 700; }
.cp .cp-val { font-size: 14.5px; font-weight: 600; color: var(--ink);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cp .cp-val.empty { color: var(--muted); font-weight: 400; font-style: italic; }
.cp .cp-icon { flex: none; color: var(--muted); font-size: 12px; font-weight: 700; display: flex; align-items: center; gap: 4px; }
.cp.copied .cp-icon { color: var(--done); }

/* Full answer rows */
.ans-row { display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 11px 0; border-top: 1px solid var(--line); }
.ans-row:first-child { border-top: 0; }
.ans-row .ans-q { font-size: 13px; color: var(--muted); max-width: 60%; }
.ans-row .ans-right { display: flex; align-items: center; gap: 10px; min-width: 0; }
.ans-row .ans-v { font-weight: 600; white-space: pre-wrap; text-align: right; }
.mini-copy { appearance: none; border: 1.5px solid var(--line); background: var(--surface);
  border-radius: 8px; padding: 8px 14px; min-height: 38px; font: inherit; font-size: 12.5px; font-weight: 600;
  color: var(--muted); cursor: pointer; flex: none; transition: all 0.15s; }
.mini-copy:hover { border-color: var(--accent); color: var(--accent); }
.mini-copy.copied { border-color: var(--done); color: var(--done); background: #f0fdf4; }

.toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(20px);
  background: var(--ink); color: #fff; padding: 10px 18px; border-radius: 999px; font-size: 14px;
  font-weight: 600; opacity: 0; pointer-events: none; transition: opacity 0.2s, transform 0.2s; z-index: 50; }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

.paste-area textarea { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; min-height: 120px; }

.attachments a { color: var(--accent); font-weight: 600; text-decoration: none; }
.attachments a:hover { text-decoration: underline; }

.head-actions { display: flex; gap: 8px; flex-wrap: wrap; }

/* Printing the staff results view: drop interactive chrome, keep the content */
@media print {
  body { background: #fff; }
  .toast, .mini-copy, .head-actions, .review-edit, .cp .cp-icon { display: none !important; }
  .card { box-shadow: none; border-color: #ccc; break-inside: avoid; }
  .cp { border-color: #ccc; }
  .xero-card { background: #fff; border-color: #ccc; }
}

@media (max-width: 480px) {
  .app { padding: 18px 12px 56px; }
  .card { padding: 18px; }
  .bank { grid-template-columns: 1fr; }
  .yesno { display: flex; width: 100%; }
  .yesno button { flex: 1; padding: 12px 0; }
  /* Full-width, evenly split navigation buttons are easier to thumb-tap */
  .nav .spacer { display: none; }
  .nav .btn { flex: 1; }
  .head-actions { width: 100%; }
  .head-actions .btn { flex: 1; }
  .results-head { gap: 10px; }
}

  </style>
</head>
<body>
  <main class="app">
    <header class="top">
      <div class="brand">
        <div class="logo-mark" aria-hidden="true">
          <div class="lm-stack">
            <span class="lm-l">LMS</span>
            <span class="lm-s">ADVISORY</span>
          </div>
        </div>
        <div class="titles">
          <h1>LMS Advisory</h1>
          <span class="tag">Tax Questionnaire · Staff results</span>
        </div>
      </div>
    </header>

    <div id="results-root" aria-live="polite"></div>

    <p class="footnote firm">
      LMS Advisory Pty Ltd — Certified Practising Accountants | Registered Tax Agent | ABN 65 302 567 149
    </p>
  </main>

  <div class="toast" id="toast">Copied</div>

  <script>
/*
 * LMS Advisory — New Client Questionnaire (Tax Preparation)
 * Mirrors the Paperform "NEW CLIENT QUESTIONNAIRE - TAX PREPARATION" (v2026.01.25).
 * ----------------------------------------------------------------------------
 * Non-developers can safely edit labels, help text, options and ordering here
 * without touching the form engine (app.js).
 *
 * Question types:
 *   text | tel | email | textarea | date | select | radio | yesno |
 *   checkboxes | bank | file | acknowledge
 *
 * showIf conditions (a question only shows/required when matched):
 *   { field: 'id', equals: 'Yes' }
 *   { field: 'id', in: ['A','B'] }
 *   { field: 'id', contains: 'Option text' }   // for checkboxes (array) fields
 */

const FORM_SCHEMA = {
  title: "New Client Questionnaire — Tax Preparation",
  version: "v2026.01.25",
  intro:
    "Welcome to LMS Advisory. Please complete the questions below so we can prepare " +
    "your income tax return. Your progress is saved automatically on this device — " +
    "you can return and finish later.",

  steps: [
    {
      id: "about_you",
      title: "About you",
      subtitle: "So we know who we're acting for and can meet our verification obligations.",
      questions: [
        {
          id: "full_name",
          type: "text",
          label: "What is your full name including any middle names?",
          help:
            "Please ensure this matches your drivers licence or passport. We will need to " +
            "contact you to verify these details as per our AML/CTF obligations.",
          required: true,
          autocomplete: "name",
          placeholder: "e.g. Owen James Smith",
        },
        {
          id: "date_of_birth",
          type: "date",
          label: "What is your Date of Birth?",
          required: true,
          autocomplete: "bday",
        },
        {
          id: "residential_address",
          type: "textarea",
          label: "Please confirm your current residential address to include in the return.",
          help: "We will also treat this as your postal address.",
          required: true,
          autocomplete: "street-address",
          placeholder: "Unit / Street / Suburb / State / Postcode",
        },
        {
          id: "mobile",
          type: "tel",
          label:
            "Confirm Mobile Phone number to access secure documents and complete " +
            "electronic signature verification?",
          help:
            "We use Fusesign for digital signatures. The added layer of SMS authentication " +
            "ensures that your Tax File Number will always be secure to you. Every individual " +
            "return lodged needs its own unique email address and unique mobile phone number.",
          required: true,
          validate: "mobile",
          autocomplete: "tel-national",
          placeholder: "04xx xxx xxx",
        },
        {
          id: "occupation",
          type: "text",
          label: "What would you describe as your Primary Occupation?",
          help:
            "It is important we select the right occupation code in your return, as the ATO " +
            "will benchmark the usual deductions claimed in different industries against your peers.",
          required: true,
          autocomplete: "organization-title",
          placeholder: "e.g. Landscaper",
        },
        {
          id: "signing_email",
          type: "email",
          label: "Preferred email address for electronic signing of documents?",
          help:
            "Every return lodged for each taxpayer needs its own unique email address and " +
            "mobile phone number.",
          required: true,
          validate: "email",
          autocomplete: "email",
          placeholder: "name@example.com",
        },
      ],
    },

    {
      id: "year_refund",
      title: "Tax year & refund",
      subtitle: "The year(s) we're lodging and where any refund should go.",
      questions: [
        {
          id: "tax_year",
          type: "checkboxes",
          label: "What Tax Year are we completing for you?",
          help: "Select all that apply.",
          required: true,
          options: ["2026", "2025", "2024", "2023", "2022", "Multiple Years", "Other"],
        },
        {
          id: "tax_year_other",
          type: "text",
          label: "Which other year(s) should we complete?",
          required: false,
          showIf: { field: "tax_year", contains: "Other" },
        },
        {
          // Free-text in the original form. Captured as structured fields here so
          // staff can copy Account name / BSB / Account number straight into Xero.
          id: "bank",
          type: "bank",
          label:
            "What is your preferred Bank Account for your refund? Please provide even if you " +
            "anticipate your return being payable this year.",
          help: "Please provide Account Name, BSB and Account Number.",
          required: true,
        },
        {
          id: "use_trust_account",
          type: "yesno",
          label:
            "If your return is refundable, do you intend to use the LMS Trust Account service " +
            "to pay your tax return fee from your refund?",
          help:
            "Our fees will be quoted in advance wherever possible. If your return is refundable " +
            "and you wish to use the Trust Account Service, the ATO will pay your refund into our " +
            "Trust Account first. Your agreed fee is then transferred to LMS and the balance " +
            "returned to you. This may delay receipt of your refund by up to 1 week. There is no " +
            "charge for using the Trust Account service. We will send you a Trust Authority " +
            "document to complete with your tax paperwork.",
          required: true,
        },
      ],
    },

    {
      id: "getting_started",
      title: "Getting started",
      subtitle: "A couple of quick questions before we dig in.",
      questions: [
        {
          id: "received_checklist",
          type: "yesno",
          label:
            "Have you received a copy of our Tax Checklist for completion to assist you in " +
            "providing us with the documents we'll need to complete your return?",
          help:
            "Copies can also be downloaded from the LMS website: " +
            "https://www.lmsadvisory.com.au/knowledge/taxpreparation/",
          required: false,
        },
        {
          id: "consultation",
          type: "radio",
          label:
            "Do you require a consultation with an accountant in relation to your tax affairs?",
          help:
            "In-person appointments are not necessary to progress tax return preparation. If you " +
            "are looking to book an in-person advice consultation with one of our accountants, you " +
            "can schedule once your returns are complete. Appointments outside of office hours and " +
            "on Saturdays are available by Zoom only. Please note additional fees may apply for " +
            "consultations.",
          required: true,
          options: ["Yes", "No", "Unsure, I'd like a phone call to discuss"],
        },
      ],
    },

    {
      id: "about_return",
      title: "About your return",
      subtitle: "This helps us tailor our advice to your circumstances.",
      questions: [
        {
          id: "significant_items",
          type: "checkboxes",
          label: "Do any of these significant items apply to you?",
          help: "Multiple answers could apply — this will help guide us in advising you on your tax affairs.",
          required: true,
          options: [
            "I am a sole trader",
            "Bought/Sold a Significant Asset required a Capital Gains Tax calculation (investment property/shares)",
            "Own 1 or more investment properties",
            "Got Married in the financial year",
            "Separated from your spouse in the financial year",
            "Welcomed a new child into the world",
            "Moved House (changed my main residence)",
            "Started a new job / Retired",
            "Started my own business",
            "Commenced new studies / Finalised my studies",
            "Paid out my HECS Debt",
            "Refinanced a home loan or investment loan",
            "Invest or Trade in Crypto",
            "Make additional contributions to super",
            "Unsure",
            "Other",
          ],
        },
        // --- Conditional follow-ups driven by the significant items above ---
        {
          id: "sole_trader_abn",
          type: "text",
          label: "As a sole trader, what is your ABN?",
          required: false,
          validate: "abn",
          placeholder: "11 digits",
          showIf: { field: "significant_items", contains: "I am a sole trader" },
        },
        {
          id: "rental_summary_ready",
          type: "yesno",
          label:
            "Do you have your agent's Annual Rental Summary, loan statements and out-of-pocket " +
            "expenses ready to provide?",
          help: "Our checklist has a detailed rental schedule you can complete.",
          required: false,
          showIf: { field: "significant_items", contains: "Own 1 or more investment properties" },
        },
        {
          id: "crypto_detail",
          type: "textarea",
          label: "Tell us briefly about your crypto activity.",
          help: "Which exchanges you used and roughly how many transactions — we'll follow up for detail.",
          required: false,
          showIf: { field: "significant_items", contains: "Invest or Trade in Crypto" },
        },
        {
          id: "significant_items_other",
          type: "text",

  <script>
/*
 * LMS Advisory — Staff results view
 * Renders a single submission with one-click copy on every field, plus a
 * Xero-shaped contact card so staff can paste straight into "Add Contact".
 *
 * It loads a submission from (in priority order):
 *   1. ?d=<base64url JSON>   — e.g. a link included in the notification email
 *   2. localStorage "lms_last_submission" — the most recent demo submission
 *   3. a paste box shown when nothing else is found
 */
(function () {
  "use strict";

  const root = document.getElementById("results-root");
  const toastEl = document.getElementById("toast");
  const schema = typeof FORM_SCHEMA !== "undefined" ? FORM_SCHEMA : { steps: [] };
  const labelOf = {};
  const typeOf = {};
  schema.steps.forEach((s) => s.questions.forEach((q) => { labelOf[q.id] = q.label; typeOf[q.id] = q.type; }));

  /* --------------------------------------------------------------- helpers */
  function el(tag, attrs, kids) {
    const n = document.createElement(tag);
    if (attrs)
      for (const k in attrs) {
        if (k === "class") n.className = attrs[k];
        else if (k.startsWith("on") && typeof attrs[k] === "function")
          n.addEventListener(k.slice(2).toLowerCase(), attrs[k]);
        else if (attrs[k] != null) n.setAttribute(k, attrs[k]);
      }
    (kids || []).forEach((c) => c != null && n.appendChild(typeof c === "string" ? document.createTextNode(c) : c));
    return n;
  }

  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    clearTimeout(toast._t);
    toast._t = setTimeout(() => toastEl.classList.remove("show"), 1200);
  }

  async function copy(text) {
    try {
      await navigator.clipboard.writeText(text);
    } catch (e) {
      const ta = document.createElement("textarea");
      ta.value = text;
      ta.style.position = "fixed";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand("copy"); } catch (_) {}
      document.body.removeChild(ta);
    }
  }

  function flash(node, label) {
    node.classList.add("copied");
    setTimeout(() => node.classList.remove("copied"), 1100);
    toast(label ? "Copied " + label : "Copied");
  }

  function b64urlDecode(s) {
    s = s.replace(/-/g, "+").replace(/_/g, "/");
    while (s.length % 4) s += "=";
    return decodeURIComponent(escape(atob(s)));
  }

  /* ------------------------------------------------------------ value text */
  function fmtBsb(v) {
    const d = String(v || "").replace(/\D/g, "");
    return d.length === 6 ? d.slice(0, 3) + "-" + d.slice(3) : d;
  }

  function displayValue(key, value) {
    if (value == null || value === "") return "—";
    if (typeOf[key] === "acknowledge") return value === true ? "Agreed ✓" : "—";
    if (typeof value === "boolean") return value ? "Yes" : "No";
    if (key === "mobile") {
      const d = String(value).replace(/\D/g, "");
      return d.length === 10 ? d.replace(/(\d{4})(\d{3})(\d{3})/, "$1 $2 $3") : value;
    }
    if (Array.isArray(value)) return value.length ? value.join(", ") : "—";
    if (typeof value === "object") {
      if ("bsb" in value)
        return `BSB ${fmtBsb(value.bsb)}   Acc ${value.account_number || "—"}\n${value.account_name || ""}`.trim();
      return JSON.stringify(value);
    }
    return String(value);
  }

  /* ----------------------------------------------------------- copy widgets */
  // Big labelled click-to-copy tile (used in the Xero card).
  function copyTile(label, value) {
    const has = value != null && String(value).trim() !== "";
    const tile = el("button", {
      class: "cp", type: "button", title: has ? "Click to copy" : "Not provided",
      onclick: () => { if (has) { copy(String(value)); flash(tile, label); } },
    }, [
      el("span", { class: "cp-body" }, [
        el("span", { class: "cp-label" }, [label]),
        el("span", { class: "cp-val" + (has ? "" : " empty") }, [has ? String(value) : "not provided"]),
      ]),
      el("span", { class: "cp-icon" }, [has ? "⧉ copy" : ""]),
    ]);
    return tile;
  }

  // Compact answer row with a copy button on the right.
  function answerRow(question, valueText, rawForCopy) {
    const btn = el("button", { class: "mini-copy", type: "button",
      onclick: () => { copy(rawForCopy); flash(btn); btn.textContent = "Copied ✓"; setTimeout(() => (btn.textContent = "Copy"), 1100); } },
      ["Copy"]);
    return el("div", { class: "ans-row" }, [
      el("div", { class: "ans-q" }, [question]),
      el("div", { class: "ans-right" }, [
        el("div", { class: "ans-v" }, [valueText]),
        btn,
      ]),
    ]);
  }

  /* --------------------------------------------------------------- render */
  function render(payload) {
    root.innerHTML = "";
    const a = payload.answers || {};
    const fullName = a.full_name || "Unknown client";
    const firstName = fullName.split(" ")[0] || "";
    const lastName = fullName.split(" ").slice(1).join(" ");
    const bank = a.bank || {};

    /* Header */
    const head = el("div", { class: "card" }, [
      el("div", { class: "results-head" }, [
        el("div", {}, [
          el("h2", { style: "margin:0" }, [fullName]),
          el("div", { class: "meta" }, [
            `${a.occupation || "Occupation n/a"} · Tax year ${a.tax_year || "n/a"}` +
            (payload.submitted_at ? " · " + new Date(payload.submitted_at).toLocaleString("en-AU") : ""),
          ]),
        ]),
        el("div", { class: "head-actions" }, [
          el("button", { class: "btn btn-ghost", type: "button",
            onclick: () => { copy(plainTextSummary(payload)); toast("Copied full summary"); } },
            ["Copy full summary"]),
          el("button", { class: "btn btn-ghost", type: "button",
            onclick: () => window.print() }, ["Print / PDF"]),
        ]),
      ]),

      /* Xero contact quick-copy */
      el("div", { class: "section-title" }, ["Xero · Add Contact"]),
      el("div", { class: "xero-card" }, [
        el("h3", {}, ["Paste these into Xero"]),
        el("p", { class: "hint" }, ["Click any field to copy it, then paste into the matching box in Xero's New Contact form."]),
        el("div", { class: "copy-grid" }, [
          copyTile("Contact name", fullName),
          copyTile("First name", firstName),
          copyTile("Last name", lastName),
          copyTile("Email", a.signing_email),
          copyTile("Mobile", displayValue("mobile", a.mobile)),
          copyTile("Date of birth", a.date_of_birth),
          copyTile("Postal address", a.residential_address),
          copyTile("Occupation", a.occupation),
          copyTile("Account name", bank.account_name),
          copyTile("BSB", fmtBsb(bank.bsb)),
          copyTile("Account number", bank.account_number),
        ]),
        el("div", { style: "margin-top:10px" }, [
          el("button", { class: "btn btn-primary", type: "button", style: "padding:10px 18px",
            onclick: (e) => { copy(xeroBlock(payload)); flash(e.target, "contact block"); } },
            ["⧉ Copy full contact block"]),
        ]),
      ]),
    ]);
    root.appendChild(head);

    /* All answers grouped by the form's steps */
    schema.steps.forEach((step) => {
      const rows = step.questions
        .filter((q) => q.id in a && a[q.id] != null && a[q.id] !== "" && !(Array.isArray(a[q.id]) && a[q.id].length === 0))
        .map((q) => {
          const vText = displayValue(q.id, a[q.id]);
          const raw = q.type === "bank" ? `${fmtBsb(a[q.id].bsb)} ${a[q.id].account_number} ${a[q.id].account_name}` : vText;
          return answerRow(q.label, vText, raw);
        });
      if (!rows.length) return;
      const card = el("div", { class: "card" }, [
        el("div", { class: "section-title", style: "margin-top:0" }, [step.title]),
        ...rows,
      ]);
      root.appendChild(card);
    });

    /* Attachments */
    if (payload.files && payload.files.length) {
      const card = el("div", { class: "card attachments" }, [
        el("div", { class: "section-title", style: "margin-top:0" }, ["Attachments"]),
        ...payload.files.map((f) =>
          el("div", { class: "ans-row" }, [
            el("a", { href: f.data || "#", download: f.name }, [f.name]),
            el("span", { class: "meta" }, [`${(f.size / 1024).toFixed(0)} KB`]),
          ])
        ),
      ]);
      root.appendChild(card);
    }
  }

  /* ------------------------------------------------------ copy compositions */
  function xeroBlock(payload) {
    const a = payload.answers || {};
    const bank = a.bank || {};
    return [
      `Contact name: ${a.full_name || ""}`,
      `First name: ${(a.full_name || "").split(" ")[0]}`,
      `Last name: ${(a.full_name || "").split(" ").slice(1).join(" ")}`,
      `Email: ${a.signing_email || ""}`,
      `Mobile: ${displayValue("mobile", a.mobile)}`,
      `Date of birth: ${a.date_of_birth || ""}`,
      `Postal address: ${a.residential_address || ""}`,
      `Occupation: ${a.occupation || ""}`,
      `Bank account name: ${bank.account_name || ""}`,
      `BSB: ${fmtBsb(bank.bsb)}`,
      `Account number: ${bank.account_number || ""}`,
    ].join("\n");
  }

  function plainTextSummary(payload) {
    const a = payload.answers || {};
    const lines = [`${a.full_name || "Client"} — Tax Questionnaire`,
      payload.submitted_at ? new Date(payload.submitted_at).toLocaleString("en-AU") : "", ""];
    schema.steps.forEach((step) => {
      step.questions.forEach((q) => {
        if (!(q.id in a)) return;
        const v = displayValue(q.id, a[q.id]);
        if (v === "—") return;
        lines.push(`${q.label}\n  ${v.replace(/\n/g, "\n  ")}`);
      });
    });
    if (payload.files && payload.files.length)
      lines.push("", "Attachments: " + payload.files.map((f) => f.name).join(", "));
    return lines.join("\n");
  }

  /* --------------------------------------------------------- data loading */
  function renderPasteBox() {
    root.innerHTML = "";
    const ta = el("textarea", { placeholder: "Paste the submission JSON here…" });
    root.appendChild(el("div", { class: "card paste-area" }, [
      el("div", { class: "step-head" }, [
        el("h2", {}, ["Open a submission"]),
        el("p", {}, ["No submission was supplied in the link. Paste a submission JSON below, or open this page via the link in the notification email."]),
      ]),
      ta,
      el("div", { class: "nav" }, [
        el("div", { class: "spacer" }),
        el("button", { class: "btn btn-primary", type: "button",
          onclick: () => { try { render(JSON.parse(ta.value)); } catch (e) { alert("That doesn't look like valid JSON."); } } },
          ["Open"]),
      ]),
    ]));
  }

  function load() {
    const params = new URLSearchParams(location.search);
    if (params.get("d")) {
      try { return render(JSON.parse(b64urlDecode(params.get("d")))); }
      catch (e) { /* fall through */ }
    }
    try {
      const raw = localStorage.getItem("lms_last_submission");
      if (raw) return render(JSON.parse(raw));
    } catch (e) {}
    renderPasteBox();
  }

  load();
})();

  </script>
